name: Update weekly technology news

on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * 1"

permissions:
  contents: write

concurrency:
  group: weekly-tech-news
  cancel-in-progress: false

jobs:
  curate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Langfuse-observed briefing
        run: npm run update:tech-news
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: https://us.cloud.langfuse.com

      - name: Commit generated briefing
        run: |
          git config user.name "Sibu Tech Intelligence Agent"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/tech-news.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update weekly technology briefing"
            git push origin master
          fi

      - name: Build website
        run: npm run build

      - name: Publish to gh-pages
        run: npx gh-pages -d dist -b gh-pages --dotfiles -m "Deploy weekly technology briefing"
        env:
          GH_TOKEN: ${{ github.token }}
