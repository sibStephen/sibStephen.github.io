name: Update weekly technology news

on:
  workflow_dispatch:
  schedule:
    - cron: "15 14 * * 1"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate weekly technology briefing
        run: node scripts/update-tech-news.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}

      - name: Verify generated news
        run: |
          test -f public/tech-news.json
          cat public/tech-news.json

      - name: Commit updated briefing
        run: |
          git config user.name "Sibu Tech News Agent"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/tech-news.json

          if git diff --cached --quiet; then
            echo "No news changes to commit."
            exit 0
          fi

          git commit -m "chore: update weekly technology briefing"
          git push origin master
